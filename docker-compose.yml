version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: alumni_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: alumni_portal
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: alumni_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/alumni_portal
      - SECRET_KEY=prod-secret-key-32-chars-long!
      - JWT_SECRET_KEY=prod-jwt-secret-key-32-chars!
      - CORS_ORIGINS=http://localhost:80,http://localhost,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: alumni_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
