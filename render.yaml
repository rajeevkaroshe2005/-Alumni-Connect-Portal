services:
  # -------------------------------------------------------------
  # Unified Web Service (Flask API + React Frontend + WebSockets)
  # Serves both the complete frontend UI and backend on one link!
  # -------------------------------------------------------------
  - type: web
    name: alumni-connect-portal
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 50 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTO_SEED
        value: "true"
      - key: USE_SQLITE
        value: "true"
